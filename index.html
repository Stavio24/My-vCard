<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte de Vizită Digitală</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #38bdf8;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 30px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 3px solid var(--accent);
    }
    h1 { margin: 10px 0 5px; font-size: 1.5rem; }
    p.title { color: var(--accent); font-weight: 600; margin-bottom: 20px; }
    .btn {
      display: block;
      background: var(--accent);
      color: #0f172a;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      margin: 10px 0;
      transition: transform 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--subtext);
    }
    .links-list { margin-top: 20px; text-align: left; }
    .link-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #334155;
      text-decoration: none;
      color: var(--subtext);
    }
    .link-item:hover { color: var(--accent); }
  </style>
</head>
<body>

  <div class="card" id="profile-card">
    <p>Se încarcă datele...</p>
  </div>

  <script>
    async function loadUserData() {
      try {
        // Încarcă datele din fișierul local data.json
        const response = await fetch('data.json');
        if (!response.ok) throw new Error("Fișierul data.json nu a fost găsit.");
        const data = await response.json();

        // Generare conținut vCard (.vcf) pentru descărcare
        const vcardData = `BEGIN:VCARD\nVERSION:3.0\nFN:${data.nume}\nTITLE:${data.titlu}\nTEL:${data.telefon}\nEMAIL:${data.email}\nURL:${data.website || ''}\nEND:VCARD`;
        const blob = new Blob([vcardData], { type: 'text/vcard' });
        const vcardUrl = URL.createObjectURL(blob);

        // Randare HTML
        document.getElementById('profile-card').innerHTML = `
          <img src="${data.foto || 'https://via.placeholder.com/150'}" alt="Foto Profil" class="avatar">
          <h1>${data.nume}</h1>
          <p class="title">${data.titlu}</p>
          <p style="color: var(--subtext); font-size: 0.9rem;">${data.descriere || ''}</p>

          <a href="${vcardUrl}" download="contact.vcf" class="btn">Adaugă în Contacte (.vcf)</a>
          <a href="tel:${data.telefon}" class="btn btn-secondary">📞 Apelează: ${data.telefon}</a>
          <a href="mailto:${data.email}" class="btn btn-secondary">✉️ Trimite Email</a>

          <div class="links-list">
            ${(data.linkuri || []).map(link => `
              <a href="${link.url}" target="_blank" class="link-item">
                <span>${link.eticheta}</span>
                <span>➔</span>
              </a>
            `).join('')}
          </div>
        `;
      } catch (error) {
        document.getElementById('profile-card').innerHTML = `
          <h2 style="color: #ef4444;">Eroare de încărcare</h2>
          <p>Asigură-te că ai creat fișierul <strong>data.json</strong> în același folder cu <code>index.html</code>.</p>
        `;
      }
    }

    loadUserData();
  </script>
</body>
</html>
